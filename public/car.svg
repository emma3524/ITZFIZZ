<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 160" fill="none">
  <!-- Shadow -->
  <ellipse cx="170" cy="148" rx="140" ry="10" fill="rgba(0,0,0,0.35)"/>

  <!-- Body lower -->
  <rect x="30" y="90" width="280" height="42" rx="14" fill="#1a1a1a"/>

  <!-- Body upper (cabin) -->
  <path d="M90 90 C100 55, 140 42, 170 40 C200 42, 240 55, 250 90Z" fill="#111111"/>

  <!-- Windshield -->
  <path d="M105 88 C112 65, 138 52, 170 50 C202 52, 228 65, 235 88Z" fill="#2a4a6b" opacity="0.9"/>
  <!-- Windshield glare -->
  <path d="M118 82 C124 66, 142 56, 165 54" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-linecap="round"/>

  <!-- Side stripe -->
  <rect x="30" y="102" width="280" height="6" rx="3" fill="#45db7d" opacity="0.8"/>

  <!-- Front bumper -->
  <rect x="290" y="96" width="22" height="28" rx="6" fill="#222"/>
  <!-- Front light -->
  <rect x="298" y="100" width="10" height="6" rx="2" fill="#def54f"/>
  <rect x="298" y="108" width="10" height="4" rx="1" fill="#6ac9ff" opacity="0.8"/>

  <!-- Rear bumper -->
  <rect x="28" y="96" width="22" height="28" rx="6" fill="#222"/>
  <!-- Rear light -->
  <rect x="32" y="100" width="10" height="6" rx="2" fill="#fa7328"/>
  <rect x="32" y="108" width="10" height="4" rx="1" fill="#cc3a00" opacity="0.8"/>

  <!-- Front wheel -->
  <circle cx="258" cy="128" r="22" fill="#111" stroke="#333" stroke-width="3"/>
  <circle cx="258" cy="128" r="13" fill="#1e1e1e" stroke="#444" stroke-width="2"/>
  <circle cx="258" cy="128" r="5" fill="#45db7d"/>
  <!-- Wheel spokes -->
  <line x1="258" y1="115" x2="258" y2="141" stroke="#333" stroke-width="2"/>
  <line x1="245" y1="128" x2="271" y2="128" stroke="#333" stroke-width="2"/>
  <line x1="249" y1="119" x2="267" y2="137" stroke="#333" stroke-width="2"/>
  <line x1="267" y1="119" x2="249" y2="137" stroke="#333" stroke-width="2"/>

  <!-- Rear wheel -->
  <circle cx="82" cy="128" r="22" fill="#111" stroke="#333" stroke-width="3"/>
  <circle cx="82" cy="128" r="13" fill="#1e1e1e" stroke="#444" stroke-width="2"/>
  <circle cx="82" cy="128" r="5" fill="#45db7d"/>
  <!-- Wheel spokes -->
  <line x1="82" y1="115" x2="82" y2="141" stroke="#333" stroke-width="2"/>
  <line x1="69" y1="128" x2="95" y2="128" stroke="#333" stroke-width="2"/>
  <line x1="73" y1="119" x2="91" y2="137" stroke="#333" stroke-width="2"/>
  <line x1="91" y1="119" x2="73" y2="137" stroke="#333" stroke-width="2"/>

  <!-- Door line detail -->
  <path d="M130 90 L130 132" stroke="#2a2a2a" stroke-width="1.5" stroke-dasharray="3 2"/>
  <path d="M210 90 L210 132" stroke="#2a2a2a" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Logo / badge -->
  <circle cx="170" cy="95" r="7" fill="#45db7d" opacity="0.9"/>
  <text x="170" y="99" text-anchor="middle" font-size="7" font-weight="bold" fill="#111" font-family="sans-serif">IF</text>
</svg>
